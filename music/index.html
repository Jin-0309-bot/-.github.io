<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おとばこ｜ブラウザで聴ける音楽プレーヤー</title>
<meta name="description" content="自動作曲されたオリジナル曲と、自分の音楽ファイルを聴ける無料の音楽プレーヤー。プレイリスト・いいね・シャッフル・キュー対応。">
<meta name="theme-color" content="#110f15">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A7%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#110f15;--s1:#19171f;--s2:#221f2a;--s3:#2e2a38;--tx:#f4f1f8;--mu:#aaa4b6;--dim:#716b7e;--ac:#ff8a3d;--ac2:#ffb36b;--ln:#2f2b38;--side:250px;--barh:86px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{width:22px;height:22px;fill:currentColor;display:block;flex:none}
img{display:block;object-fit:cover}
/* YouTube player (always visible while a YouTube track is current) */
#ytbox{position:fixed;z-index:15;right:16px;bottom:calc(var(--barh) + 16px);width:356px;height:200px;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#ytbox.innp{z-index:22;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
#ytbox iframe{width:100%;height:100%;border:0;display:block}
body.ytmini #view{padding-bottom:240px}
#npVid{display:none;width:100%;aspect-ratio:16/9;border-radius:10px;background:#000}
#np.vid #npImg{display:none}
#np.vid #npVid{display:block}
.ytadd{display:flex;flex-direction:column;gap:10px;padding:4px 24px 18px;max-width:640px}
.ytadd form{display:flex;gap:8px}
.ytadd label{flex:1;display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:999px;padding:0 14px;border:2px solid transparent;min-width:0}
.ytadd label:focus-within{border-color:var(--tx)}
.ytadd label svg{color:var(--mu);width:20px;height:20px}
.ytadd input{flex:1;background:none;border:0;outline:0;padding:11px 0;font-size:15px;min-width:0}
.ytadd button{flex:none}
.ytadd p{color:var(--mu);font-size:12px;line-height:1.7}
[hidden]{display:none!important}
#app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:minmax(0,1fr) var(--barh);height:100vh;height:100dvh;gap:8px;padding:8px 8px 0}
/* sidebar */
#side{background:var(--s1);border-radius:12px;overflow:auto;padding:18px 10px;display:flex;flex-direction:column;gap:2px;min-height:0}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;padding:0 12px 14px;letter-spacing:.02em}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--ac),#c056ff);display:grid;place-items:center;font-style:normal;font-size:16px}
.nav{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:8px;color:var(--mu);font-weight:700;width:100%;text-align:left}
.nav:hover{color:var(--tx)}
.nav.on{color:var(--tx);background:var(--s2)}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:18px 12px 6px;color:var(--mu);font-weight:700;font-size:13px}
.side-h button{color:var(--mu);padding:4px;border-radius:50%}
.side-h button:hover{color:var(--tx);background:var(--s2)}
.spl{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;width:100%;text-align:left;min-width:0}
.spl:hover{background:var(--s2)}
.spl.on{background:var(--s3)}
.spl img{width:40px;height:40px;border-radius:6px}
.spl div{min-width:0}
.spl b,.spl span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spl b{font-weight:600}
.spl span{color:var(--mu);font-size:12px}
.spl.playing b{color:var(--ac)}
/* main */
#main{background:var(--s1);border-radius:12px;overflow:auto;position:relative;min-height:0}
#view{min-height:100%;padding-bottom:40px}
.pad{padding:24px 24px 0}
h1.greet{font-size:28px;font-weight:800;margin-bottom:18px}
h2{font-size:21px;font-weight:800;margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:13px;color:var(--mu);font-weight:600}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.qt{display:flex;align-items:center;gap:12px;background:var(--s2);border-radius:6px;overflow:hidden;cursor:pointer;position:relative;font-weight:700;min-width:0;transition:background .15s}
.qt:hover{background:var(--s3)}
.qt img{width:58px;height:58px}
.qt span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:52px}
.qt .cplay{right:10px;bottom:auto;top:50%;transform:translateY(-50%) scale(.9);width:38px;height:38px}
.qt:hover .cplay{transform:translateY(-50%)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:transparent;padding:10px;border-radius:10px;cursor:pointer;min-width:0;transition:background .15s}
.card:hover{background:var(--s2)}
.cimg{position:relative;margin-bottom:10px}
.cimg img{width:100%;aspect-ratio:1;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{display:block;color:var(--mu);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cplay{position:absolute;right:8px;bottom:8px;width:46px;height:46px;border-radius:50%;background:var(--ac);color:#1a0f08;display:grid;place-items:center;box-shadow:0 8px 16px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:.2s}
.card:hover .cplay,.qt:hover .cplay,.cplay.on{opacity:1;transform:none}
.qt .cplay.on{transform:translateY(-50%)}
.card.add .cimg div{aspect-ratio:1;border-radius:8px;border:2px dashed var(--s3);display:grid;place-items:center;color:var(--mu)}
.card.add .cimg svg{width:40px;height:40px}
.note{color:var(--dim);font-size:12px;margin-top:36px;line-height:1.7}
/* header of lists */
.hd{display:flex;align-items:flex-end;gap:22px;padding:56px 24px 22px;background:linear-gradient(hsl(var(--h) 42% 34%),hsl(var(--h) 30% 18%))}
.hd img{width:200px;height:200px;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);flex:none}
.hd .kind{font-size:13px;font-weight:600}
.hd h1{font-size:clamp(28px,5vw,58px);font-weight:900;line-height:1.1;margin:6px 0 10px;word-break:break-word}
.hd p{color:#e2dcea;font-size:14px}
.hd p.desc{color:#cfc8da;margin-bottom:4px}
.acts{display:flex;align-items:center;gap:18px;padding:20px 24px;background:linear-gradient(hsl(var(--h) 30% 18% / .6),transparent 120px)}
.bigplay{width:56px;height:56px;border-radius:50%;background:var(--ac);color:#1a0f08;display:grid;place-items:center;transition:transform .1s}
.bigplay:hover{transform:scale(1.05)}
.bigplay svg{width:28px;height:28px}
.ic{color:var(--mu);padding:8px;border-radius:50%;display:grid;place-items:center;transition:color .15s}
.ic:hover{color:var(--tx)}
.ic.on{color:var(--ac)}
.acts .ic svg{width:28px;height:28px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px}
.chip:hover{background:var(--s3)}
.chip svg{width:18px;height:18px}
.chip.pri{background:var(--ac);color:#1a0f08}
/* track list */
.tl{padding:0 16px}
.row{display:grid;grid-template-columns:32px 40px minmax(0,1fr) minmax(0,.8fr) 36px 52px 36px;align-items:center;gap:12px;padding:6px 8px;border-radius:6px;cursor:pointer;user-select:none}
.row:hover{background:var(--s2)}
.row .n{color:var(--mu);text-align:right;font-variant-numeric:tabular-nums;position:relative;height:20px}
.row .n .eq{display:none}
.row.on .n .num{display:none}
.row.on .n .eq{display:flex}
.row.on .t{color:var(--ac)}
.row img{width:40px;height:40px;border-radius:4px}
.row .meta{min-width:0}
.row .t,.row .a,.row .alb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t{font-weight:600;font-size:15px}
.row .a,.row .alb{color:var(--mu);font-size:13px}
.row .d{color:var(--mu);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.row .like{opacity:0}
.row:hover .like,.row .like.on{opacity:1}
.row .more{opacity:.0}
.row:hover .more{opacity:1}
.row .ic svg{width:20px;height:20px}
.tl-h{display:grid;grid-template-columns:32px 40px minmax(0,1fr) minmax(0,.8fr) 36px 52px 36px;gap:12px;padding:0 8px 8px;margin:0 16px 8px;border-bottom:1px solid var(--ln);color:var(--mu);font-size:13px}
.tl-h span:first-child{text-align:right}
.tl-h span:nth-child(6){text-align:right}
.eq{gap:2px;align-items:flex-end;justify-content:flex-end;height:16px;margin-top:2px}
.eq i{width:3px;background:var(--ac);border-radius:1px;height:30%;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.empty{text-align:center;padding:50px 20px;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:20px;margin-bottom:8px}
.empty .chip{margin-top:16px}
/* search */
.sbox{position:sticky;top:0;z-index:3;background:var(--s1);padding:16px 24px 12px}
.sbox label{display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:999px;padding:0 16px;max-width:420px;border:2px solid transparent}
.sbox label:focus-within{border-color:var(--tx)}
.sbox input{flex:1;background:none;border:0;outline:0;padding:12px 0;font-size:15px;min-width:0}
.sbox svg{color:var(--mu)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.tile{position:relative;aspect-ratio:1.6;border-radius:10px;overflow:hidden;padding:14px;font-weight:800;font-size:19px;cursor:pointer;background:hsl(var(--h) 55% 42%)}
.tile img{position:absolute;width:44%;right:-6%;bottom:-6%;transform:rotate(22deg);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
/* library */
.libtop{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.li{display:flex;align-items:center;gap:14px;padding:8px;border-radius:8px;cursor:pointer;min-width:0}
.li:hover{background:var(--s2)}
.li img{width:56px;height:56px;border-radius:6px}
.li div{min-width:0}
.li b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li span{color:var(--mu);font-size:13px}
.li.playing b{color:var(--ac)}
/* player bar */
#bar{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);align-items:center;gap:12px;padding:0 8px;position:relative}
.b-left{display:flex;align-items:center;gap:12px;min-width:0}
.b-cover{width:56px;height:56px;border-radius:6px;overflow:hidden;flex:none;background:var(--s2)}
.b-cover img{width:100%;height:100%}
.b-meta{min-width:0;cursor:pointer}
.b-meta .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-meta .a{color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-center{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.ctrls{display:flex;align-items:center;gap:14px}
.ctrls .ic svg{width:20px;height:20px}
.ctrls .ic.on{position:relative}
.ctrls .ic.on::after{content:"";position:absolute;bottom:0;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ac)}
.play{width:36px;height:36px;border-radius:50%;background:var(--tx);color:var(--bg);display:grid;place-items:center;transition:transform .1s;position:relative}
.play:hover{transform:scale(1.06)}
.play.loading svg{opacity:0}
.play.loading::before{content:"";position:absolute;inset:7px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seek{display:flex;align-items:center;gap:8px;width:100%;max-width:620px;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.seek span{min-width:38px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:16px;background:transparent;cursor:pointer;--p:0%;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--tx) var(--p),#4a4556 var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--tx) var(--p),#4a4556 var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--tx);margin-top:-4px;opacity:0;transition:opacity .1s}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--tx);opacity:0}
input[type=range]:hover::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--ac) var(--p),#4a4556 var(--p))}
input[type=range]:hover::-moz-range-track{background:linear-gradient(to right,var(--ac) var(--p),#4a4556 var(--p))}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{opacity:1}
input[type=range]:hover::-moz-range-thumb{opacity:1}
.b-right{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.b-right .ic svg{width:20px;height:20px}
#vol{max-width:110px}
.m-only{display:none!important}
#mprog{display:none}
/* mobile tabs */
#tabs{display:none}
/* now playing */
#np{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.np-bg{position:fixed;inset:0;background:linear-gradient(hsl(var(--h) 40% 30%),var(--bg) 75%);pointer-events:none}
.np-in{position:relative;max-width:460px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));min-height:100%;display:flex;flex-direction:column;gap:18px}
.np-top{display:flex;align-items:center;justify-content:space-between}
.np-top .ic{color:var(--tx)}
.np-ctx{text-align:center;min-width:0;flex:1}
.np-ctx small{display:block;font-size:11px;color:var(--mu);letter-spacing:.08em}
.np-ctx b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-art{position:relative;margin-top:10px}
.np-art img{width:100%;aspect-ratio:1;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
#viz{width:100%;height:70px;display:block;margin-top:14px}
.np-meta{display:flex;align-items:center;gap:10px}
.np-meta>div{flex:1;min-width:0}
.np-meta .t{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-meta .a{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-meta .ic svg{width:28px;height:28px}
.np-seek{display:flex;flex-direction:column;gap:2px}
.np-seek .times{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.np-seek input::-webkit-slider-thumb{opacity:1}
.np-seek input::-moz-range-thumb{opacity:1}
.ctrls.big{justify-content:space-between;gap:0}
.ctrls.big .ic svg{width:28px;height:28px}
.ctrls.big .ic.prevnext svg{width:38px;height:38px}
.ctrls.big .play{width:66px;height:66px}
.ctrls.big .play svg{width:34px;height:34px}
.ctrls.big .play.loading::before{inset:14px}
.np-bot{display:flex;justify-content:flex-end}
/* queue panel */
#qp{position:fixed;z-index:25;top:8px;right:8px;bottom:calc(var(--barh) + 8px);width:min(380px,calc(100% - 16px));background:var(--s2);border-radius:12px;box-shadow:0 10px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateX(16px)}}
.qp-h{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 6px 18px;font-weight:800;font-size:17px}
#qpBody{overflow:auto;padding:0 8px 16px;flex:1}
#qpBody h3{font-size:13px;color:var(--mu);padding:14px 10px 6px;display:flex;justify-content:space-between;align-items:center}
#qpBody h3 button{color:var(--mu);font-size:12px}
#qpBody h3 button:hover{color:var(--tx)}
.qrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer}
.qrow:hover{background:var(--s3)}
.qrow img{width:40px;height:40px;border-radius:4px}
.qrow div{flex:1;min-width:0}
.qrow b,.qrow span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow b{font-weight:600}
.qrow span{font-size:12px;color:var(--mu)}
.qrow.cur b{color:var(--ac)}
.qrow .ic{opacity:.6}
.qrow .ic svg{width:18px;height:18px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:40;display:grid;place-items:center}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fadein .15s}
@keyframes fadein{from{opacity:0}}
.sh{position:relative;background:var(--s2);border-radius:12px;width:min(360px,calc(100% - 32px));max-height:80vh;overflow:auto;padding:8px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .15s}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.sh-h{display:flex;gap:12px;align-items:center;padding:10px 10px 12px;border-bottom:1px solid var(--ln);margin-bottom:6px}
.sh-h img{width:44px;height:44px;border-radius:4px}
.sh-h b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-h span{display:block;color:var(--mu);font-size:12px}
.sh-h div{min-width:0}
.sh-i{display:flex;align-items:center;gap:14px;width:100%;padding:11px 12px;border-radius:6px;text-align:left;font-size:15px}
.sh-i:hover{background:var(--s3)}
.sh-i svg{color:var(--mu)}
.sh-i.danger{color:#ff7b7b}.sh-i.danger svg{color:#ff7b7b}
.sh-i.cancel{justify-content:center;color:var(--mu);margin-top:4px}
.sh input{width:100%;background:var(--s3);border:2px solid transparent;border-radius:8px;padding:12px;outline:0;margin:6px 0 12px;font-size:16px}
.sh input:focus{border-color:var(--ac)}
.sh .btns{display:flex;justify-content:flex-end;gap:8px;padding:0 4px 4px}
.sh .btns button{padding:10px 18px;border-radius:999px;font-weight:700}
.sh .btns .okb{background:var(--ac);color:#1a0f08}
.sh p.msg{padding:6px 10px 14px;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:calc(var(--barh) + 24px);transform:translate(-50%,20px);background:#e8e4ee;color:#16131a;padding:10px 18px;border-radius:8px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#drop{position:fixed;inset:0;z-index:60;background:rgba(255,138,61,.15);border:4px dashed var(--ac);display:grid;place-items:center;font-size:24px;font-weight:800;pointer-events:none}
/* mobile */
@media (max-width:760px){
  :root{--barh:0px}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;padding:0;gap:0}
  #side{display:none}
  #main{border-radius:0;background:var(--bg)}
  .pad{padding:16px 16px 0}
  h1.greet{font-size:24px;margin-bottom:14px}
  .quick{grid-template-columns:1fr 1fr;gap:8px}
  .qt{font-size:13px}.qt img{width:52px;height:52px}.qt span{padding-right:6px}
  .qt .cplay{display:none}
  .cards{display:flex;overflow-x:auto;gap:4px;margin:0 -16px;padding:0 10px;scroll-snap-type:x mandatory;scroll-padding:0 10px;scrollbar-width:none}
  .cards::-webkit-scrollbar{display:none}
  .card{flex:0 0 150px;padding:6px;scroll-snap-align:start}

  #qp{inset:0;width:auto;border-radius:0;padding-top:env(safe-area-inset-top)}

}

 let a=0,lo=0,hi=0;if(env&&f*3+2<env.length){a=env[f*3];lo=env[f*3+1];hi=env[f*3+2]}else if(playing){a=.5+.3*Math.sin(now*3);lo=.5+.4*Math.sin(now*2.1);hi=.4+.3*Math.sin(now*5.3)}

  let v=playing?(lo*(1-x)*1.1+hi*x*.9+a*.4)*wob:0;v=Math.min(1,v);smooth[i]+=(v-smooth[i])*(v>smooth[i]?.5:.12);

function closeNP(fromPop){if($('#np').hidden)return;$('#np').hidden=true;vizOn=false;placeYT();if(!fromPop&&history.state&&history.state.np)history.back()}
addEventListener('resize',placeYT);$('#np').addEventListener('scroll',placeYT,{passive:true});$('#np').addEventListener('animationend',placeYT);

/* ========== adding YouTube songs ========== */
function parseYT(s){s=(s||'').trim();if(/^[\w-]{11}$/.test(s))return{vid:s};let vid=null,list=null;
 try{const u=new URL(/^https?:\/\//i.test(s)?s:'https://'+s),h=u.hostname.toLowerCase().replace(/^(www|m|music)\./,'');
  if(h==='youtu.be')vid=u.pathname.split('/')[1];
  else if(h==='youtube.com'||h==='youtube-nocookie.com'){vid=u.searchParams.get('v');const m=u.pathname.match(/^\/(?:shorts|embed|live|v)\/([\w-]{11})/);if(m)vid=m[1]}
  else return null;
  list=u.searchParams.get('list')}catch(e){return null}
 if(vid&&!/^[\w-]{11}$/.test(vid))vid=null;if(list&&!/^[\w-]+$/.test(list))list=null;return vid||list?{vid,list}:null}
let oembedOK=true;
async function ytInfo(vid){if(!oembedOK)return null;
 try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+vid));if(!r.ok)return null;const j=await r.json();return{title:j.title,artist:j.author_name}}
 catch(e){oembedOK=false;return null}}
async function fillInfo(ids){let k=0;const work=async()=>{while(k<ids.length){const t=T(ids[k++]);if(!t||!t.titleAuto)continue;const inf=await ytInfo(t.vid);
  if(inf&&inf.title&&t.titleAuto){t.title=inf.title;t.artist=inf.artist||t.artist;t.titleAuto=false;saveYT();
   $$(`.row[data-id="${t.id}"] .t`).forEach(e=>e.textContent=t.title);$$(`.row[data-id="${t.id}"] .a`).forEach(e=>e.textContent=t.artist);if(curId()===t.id)updateNow()}}};
 await Promise.all([work(),work(),work()])}
function ytPlaylist(list){return ytAPI().then(()=>new Promise(res=>{const box=document.createElement('div');box.style.cssText='position:fixed;left:-10000px;top:0;width:320px;height:180px';
 const inner=document.createElement('div');box.appendChild(inner);document.body.appendChild(box);let done=false,pl;
 const fin=v=>{if(done)return;done=true;clearInterval(iv);try{pl.destroy()}catch(e){}box.remove();res(v)};
 const iv=setInterval(()=>{try{const a=pl&&pl.getPlaylist&&pl.getPlaylist();if(a&&a.length)fin(a)}catch(e){}},400);setTimeout(()=>fin([]),12000);
 pl=new YT.Player(inner,{width:320,height:180,playerVars:{listType:'playlist',list},events:{onError:()=>fin([])}})}))}
async function addYT(input){const r=parseYT(input);if(!r){toast('YouTubeのURLを貼り付けてください');return false}
 let vids=[];
 if(r.vid&&r.list){const whole=await new Promise(res=>sheet(`<div class="sh-h"><div><b>プレイリストのURLです</b><span>どちらを追加しますか？</span></div></div>`,[{ic:'video',label:'この動画だけ',fn:()=>res(false)},{ic:'queue',label:'プレイリスト全体',fn:()=>res(true)}]));
  vids=whole?null:[r.vid]}
 else if(r.vid)vids=[r.vid];
 if(!vids){toast('プレイリストを読み込み中…');try{vids=await ytPlaylist(r.list)}catch(e){vids=[]}if(!vids.length){toast(r.vid?'プレイリストを読み込めませんでした。動画だけ追加します':'プレイリストを読み込めませんでした');if(!r.vid)return false;vids=[r.vid]}}
 const added=[];let dup=0;for(const v of vids){const t=addYTTrack({vid:v});if(t)added.push(t.id);else dup++}
 saveYT();renderSide();
 toast(added.length?`${added.length}曲を追加しました`+(dup?`（${dup}曲は追加済み）`:''):'すでに追加されています');
 if(location.hash!=='#yt')location.hash='yt';else route();
 fillInfo(added);return true}
document.addEventListener('submit',async e=>{const f=e.target;
 if(f.id==='ytForm'){e.preventDefault();const i=$('#ytUrl');if(await addYT(i.value)&&$('#ytUrl'))$('#ytUrl').value=''}
 else if(f.id==='ytFind'){e.preventDefault();const q=$('#ytQ').value.trim();window.open('https://www.youtube.com/'+(q?'results?search_query='+encodeURIComponent(q):''),'_blank','noopener')}});

/* ========== events ========== */
document.addEventListener('click',e=>{const el=e.target.closest('[data-cmd],[data-go],[data-playkey],[data-shufkey],[data-like],[data-more],[data-act],[data-playhist],[data-qrm],[data-qi],.row');if(!el)return;
 const d=el.dataset;
 if(d.cmd){const c=d.cmd;
  if(c==='toggle')toggle();else if(c==='next')next(false);else if(c==='prev')prev();else if(c==='shuffle')setShuffle(!S.shuffle);else if(c==='repeat')cycleRepeat();
  else if(c==='like')toggleLike(curId());else if(c==='np')openNP();else if(c==='np-m'){if(matchMedia('(max-width:760px)').matches)openNP();else if(Q.key)location.hash=Q.key}
  else if(c==='np-close')closeNP();else if(c==='np-more'){if(curId())trackMenu(curId())}
  else if(c==='queue'){const q=$('#qp');q.hidden=!q.hidden;renderQueue()}
  else if(c==='mute'){S.muted=!S.muted;save();setVol(S.muted?S.vol:(S.vol||.5))}
  return}
 if(d.playkey!==undefined){e.stopPropagation();const k=d.playkey;if(Q.key===k&&curId()){toggle();return}playList(idsFor(k),S.shuffle?-1:0,k);return}
 if(d.shufkey!==undefined){const k=d.shufkey;if(!S.shuffle){S.shuffle=true;save();updateModes()}playList(idsFor(k),-1,k);el.classList.add('on');return}
 if(d.like){e.stopPropagation();toggleLike(d.like);return}
 if(d.more){e.stopPropagation();trackMenu(d.more,d.i);return}
 if(d.playhist!==undefined){playList(S.hist.filter(T),+d.playhist,'hist');return}
 if(d.qrm!==undefined){e.stopPropagation();const k=+d.qrm;const id=Q.ids[k];Q.ids.splice(k,1);if(Q.orig){const o=Q.orig.lastIndexOf(id);if(o>=0)Q.orig.splice(o,1)}saveQ();renderQueue();return}
 if(d.qi!==undefined){const k=+d.qi;if(k!==Q.i){Q.i=k;load(true)}return}
 if(d.act){const a=d.act;if(a==='newpl')newPlaylist();else if(a==='import')$('#file').click();else if(a==='plmenu')plMenu();
  else if(a==='qclear'){Q.ids=Q.ids.slice(0,Q.i+1);Q.orig=null;saveQ();renderQueue()}return}
 if(d.go!==undefined){if(!$('#qp').hidden&&matchMedia('(max-width:760px)').matches)$('#qp').hidden=true;location.hash=d.go;return}
 if(el.classList.contains('row')){const i=+d.i;if(curId()===d.id&&Q.key===VIEW.key){toggle();return}playList(VIEW.ids,i,VIEW.key,VIEW.key==='search'?'検索結果':'');}
});
$('#file').onchange=e=>{importFiles(e.target.files);e.target.value=''};
let dragN=0;
addEventListener('dragenter',e=>{if([...(e.dataTransfer.types||[])].includes('Files')){dragN++;$('#drop').hidden=false}});
addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;$('#drop').hidden=true}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragN=0;$('#drop').hidden=true;if(e.dataTransfer.files.length)importFiles(e.dataTransfer.files)});
$$('.seekr').forEach(s=>{
 s.addEventListener('input',()=>{seeking=true;const d=isFinite(M.duration)?M.duration:((T(curId())||{}).dur||0);s.style.setProperty('--p',s.value/10+'%');$$('.tcur').forEach(e=>e.textContent=fmt(s.value/1000*d))});
 s.addEventListener('change',()=>{const d=isFinite(M.duration)?M.duration:((T(curId())||{}).dur||0);if(d)M.currentTime=s.value/1000*d;seeking=false;updateTime()})});
$('#vol').addEventListener('input',e=>{S.muted=false;setVol(e.target.value/100);save()});
au.addEventListener('play',updatePlayState);au.addEventListener('pause',updatePlayState);
au.addEventListener('timeupdate',updateTime);au.addEventListener('loadedmetadata',updateTime);
au.addEventListener('ended',()=>{if(!isSilent())next(true)});
au.addEventListener('error',()=>{if(au.getAttribute('src')&&!isSilent()&&!loading)toast('再生できない形式の曲です')});
addEventListener('hashchange',()=>{closeNP(true);route()});
addEventListener('popstate',e=>{if(!$('#np').hidden&&!(e.state&&e.state.np))closeNP(true)});
addEventListener('keydown',e=>{if(e.target.closest('input,textarea')||e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key==='Escape'){if(!$('#sheet').hidden)$('#sheet').hidden=true;else if(!$('#qp').hidden)$('#qp').hidden=true;else closeNP();return}
 if(!$('#sheet').hidden)return;
 if(e.code==='Space'){e.preventDefault();toggle()}
 else if(e.key==='ArrowRight'){e.preventDefault();if(e.shiftKey)next(false);else if(loadedId)M.currentTime=Math.min((M.duration||0)-.1,M.currentTime+5)}
 else if(e.key==='ArrowLeft'){e.preventDefault();if(e.shiftKey)prev();else if(loadedId)M.currentTime=Math.max(0,M.currentTime-5)}
 else if(e.key==='l'||e.key==='L')toggleLike(curId())});
if('mediaSession' in navigator){const ms=navigator.mediaSession,h=(a,f)=>{try{ms.setActionHandler(a,f)}catch(e){}};
 h('play',()=>toggle());h('pause',()=>M.pause());h('nexttrack',()=>next(false));h('previoustrack',()=>prev());
 h('seekto',e=>{M.currentTime=e.seekTime});h('seekbackward',()=>M.currentTime=Math.max(0,M.currentTime-10));h('seekforward',()=>M.currentTime+=10)}
// iOS: unlock the <audio> element on the first touch so songs that finish rendering later can start.
let unlocked=false;addEventListener('pointerdown',()=>{if(unlocked||au.getAttribute('src'))return;unlocked=true;
 au.src=SILENT;au.play().catch(()=>{}).finally(()=>{if(isSilent()){au.pause();au.removeAttribute('src')}})},{capture:true});

/* ========== start ========== */
$$('[data-cmd=np-close]').forEach(b=>b.innerHTML=ico('down'));$$('[data-cmd=np-more]').forEach(b=>b.innerHTML=ico('more'));
$$('[data-cmd=queue]').forEach(b=>b.innerHTML=ico(b.closest('.qp-h')?'close':'queue'));$('.b-right [data-cmd=np]').innerHTML=ico('expand');
$$('[data-cmd=prev]').forEach(b=>b.innerHTML=ico('prev'));$$('[data-cmd=next]').forEach(b=>b.innerHTML=ico('next'));
updateModes();updatePlayState();setVol(S.vol);updateLike();route();
(async()=>{try{await DB.open();const rows=await DB.all();rows.sort((a,b)=>a.added-b.added).forEach(addFileTrack)}catch(e){console.warn('IndexedDB unavailable',e)}
 Q.ids=Q.ids.filter(T);if(Q.orig)Q.orig=Q.orig.filter(T);Q.i=Math.max(0,Math.min(Q.i,Q.ids.length-1));
 if(Q.ids.length){updateNow();updateTime()}route()})();
</script>
