<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>リアルタイム音声翻訳</title>
<meta name="description" content="話した言葉をその場で日本語・英語に翻訳するブラウザツール。">
<style>
:root{--bg:#f6f7fb;--card:#fff;--fg:#1d2330;--sub:#5d6678;--line:#dde1ea;--accent:#2f6fec;--rec:#e5484d}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--fg:#e8ebf2;--sub:#9aa3b5;--line:#2c3340;--accent:#6c9bff;--rec:#ff6b6f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--sub);font-size:14px;margin:0 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
button,select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 16px;border-radius:10px;cursor:pointer}
#mic{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;min-width:150px}
#mic.on{background:var(--rec);border-color:var(--rec)}
label{font-size:14px;color:var(--sub);display:flex;gap:6px;align-items:center}
#status{font-size:14px;color:var(--sub);margin:0 0 12px;min-height:1.6em}
.live{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px;min-height:52px}
.live .ja{color:var(--sub)}
#log{display:flex;flex-direction:column-reverse;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.item .ja{color:var(--sub);font-size:14px}
.item .en{font-size:19px;font-weight:600;margin-top:2px}
.item .en.wait{color:var(--sub);font-weight:400}
.type{display:flex;gap:8px;margin-bottom:16px}
.type textarea{flex:1;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;min-height:48px}
.hint{font-size:13px;color:var(--sub);margin:-8px 0 16px}
.warn{margin-bottom:12px;background:#fff4d6;color:#5c4400;border-radius:10px;padding:10px 14px;font-size:14px}
@media (prefers-color-scheme:dark){.type{display:flex;gap:8px;margin-bottom:16px}
.type textarea{flex:1;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;min-height:48px}
.hint{font-size:13px;color:var(--sub);margin:-8px 0 16px}
.warn{margin-bottom:12px;background:#3a2f10;color:#ffe08a}}
</style></head>
<body><main>
<h1>🎙️ リアルタイム音声翻訳</h1>
<p class="sub">マイクに向かって話すと、その場で日本語の文章（または英語）に翻訳します。</p>
<div id="nojs" class="warn">この画面ではページの機能（スクリプト）が動いていません。ファイルのプレビューではなく、Chrome か Safari でこのページを開いてください。</div>
<div id="unsupported" class="warn" hidden></div>
<div class="bar">
  <select id="dir"><option value="en-ja">英語で話す → 日本語にする</option><option value="ja-en">日本語で話す → 英語にする</option></select>
  <button id="mic" type="button">● 話しはじめる</button>
  <button id="clear" type="button">クリア</button>
  <label><input type="checkbox" id="speak"> 翻訳を読み上げる</label>
</div>
<p id="status">ボタンを押してマイクの使用を許可してください。</p>
<div class="live"><div class="ja" id="interimJa">…</div><div id="interimEn"></div></div>
<div class="type"><textarea id="typed" rows="2" placeholder="ここに入力しても翻訳できます"></textarea><button id="send" type="button">翻訳</button></div>
<p class="hint">ボタンでの音声認識が使えないときは、この欄をタップしてキーボードの 🎤（音声入力）ボタンで話してください。話した内容がその場で翻訳されます。</p>
<div id="log"></div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  $('nojs').hidden = true;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $('mic'), status = $('status'), log = $('log'), typed = $('typed');
  const interimJa = $('interimJa'), interimEn = $('interimEn');

  const LANG = {ja: {rec: 'ja-JP', name: '日本語'}, en: {rec: 'en-US', name: '英語'}};
  let src = 'en', tgt = 'ja';
  try { const d = localStorage.getItem('dir'); if (d) $('dir').value = d; } catch (e) {}
  function syncDir() { [src, tgt] = $('dir').value.split('-'); initTranslator(); }

  // Prefer the browser's built-in on-device translator (Chrome 138+); fall back to the MyMemory API.
  // Runs in the background: the online fallback is used until the on-device model is ready.
  let translator = null;
  async function initTranslator() {
    translator = null;
    const pair = {sourceLanguage: src, targetLanguage: tgt};
    try {
      if (!('Translator' in self) || (await Translator.availability(pair)) === 'unavailable') return;
      const t = await Translator.create(pair);
      if (pair.sourceLanguage === src && pair.targetLanguage === tgt) translator = t;
    } catch (e) {}
  }
  async function translate(text) {
    if (translator) { try { return await translator.translate(text); } catch (e) {} }
    const r = await fetch('https://api.mymemory.translated.net/get?langpair=' + src + '|' + tgt + '&q=' + encodeURIComponent(text));
    const j = await r.json();
    return j.responseData.translatedText;
  }

  // Translate in-progress speech too, throttled, so the translation updates while you talk.
  let interimTimer = null, interimSeq = 0;
  function showInterim(text) {
    clearTimeout(interimTimer);
    if (!text) { interimSeq++; interimJa.textContent = '…'; interimEn.textContent = ''; return; }
    interimJa.textContent = text;
    interimTimer = setTimeout(async () => {
      const seq = ++interimSeq;
      try { const t = await translate(text); if (seq === interimSeq) interimEn.textContent = t; }
      catch (e) { if (seq === interimSeq) interimEn.textContent = '(翻訳できませんでした。インターネット接続を確認してください)'; }
    }, 600);
  }

  function addFinal(text) {
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = '<div class="ja"></div><div class="en wait">翻訳中…</div>';
    item.querySelector('.ja').textContent = text;
    log.appendChild(item);
    const en = item.querySelector('.en');
    translate(text).then(t => {
      en.textContent = t; en.classList.remove('wait');
      if ($('speak').checked && 'speechSynthesis' in self) {
        const u = new SpeechSynthesisUtterance(t); u.lang = LANG[tgt].rec; speechSynthesis.speak(u);
      }
    }).catch(() => { en.textContent = '(翻訳できませんでした。インターネット接続を確認してください)'; });
  }

  // Typed text, or the keyboard's own voice input, which works even where speech recognition doesn't.
  typed.addEventListener('input', () => showInterim(typed.value.trim()));
  function sendTyped() {
    const t = typed.value.trim();
    if (!t) return;
    showInterim(''); addFinal(t); typed.value = '';
  }
  $('send').onclick = sendTyped;
  typed.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendTyped(); } });

  $('clear').onclick = () => { log.innerHTML = ''; showInterim(''); };
  syncDir();

  function noSpeech(msg) {
    $('unsupported').textContent = msg;
    $('unsupported').hidden = false;
    status.textContent = msg;
    typed.focus();
  }
  const UNSUPPORTED = 'この画面ではボタンでの音声認識が使えません。下の入力欄をタップして、キーボードの 🎤 ボタンで話してください。ボタンで使いたいときは、Chrome（パソコン・Android）か Safari（iPhone）で直接開いてください。';
  if (!SR) {
    mic.onclick = () => noSpeech(UNSUPPORTED);
    $('dir').onchange = () => { try { localStorage.setItem('dir', $('dir').value); } catch (e) {} syncDir(); };
    return;
  }

  const rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;
  let running = false;

  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript.trim();
      if (!t) continue;
      if (e.results[i].isFinal) addFinal(t); else interim += t;
    }
    showInterim(interim);
  };
  const ERRORS = {
    'not-allowed': 'マイクの使用が許可されていません。ブラウザの設定でマイクを「許可」にするか、下の入力欄でキーボードの 🎤 ボタンを使ってください。',
    'service-not-allowed': UNSUPPORTED,
    'audio-capture': 'マイクが見つかりません。マイクがつながっているか確認してください。',
    'network': '音声認識に必要な通信ができませんでした。インターネット接続を確認してください。'
  };
  rec.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    running = false;
    setUi();
    const msg = ERRORS[e.error] || 'エラー: ' + e.error;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') noSpeech(msg); else status.textContent = msg;
  };
  // Recognition stops on its own after silence; restart while the user wants it on.
  rec.onend = () => { if (running) { try { rec.start(); } catch (e) {} } };

  function setUi() {
    mic.classList.toggle('on', running);
    mic.textContent = running ? '■ 停止' : '● 話しはじめる';
    status.textContent = running ? '聞き取り中… ' + LANG[src].name + 'で話してください。' : '停止しました。';
  }
  mic.onclick = () => {
    running = !running;
    setUi();
    if (!running) { rec.stop(); return; }
    rec.lang = LANG[src].rec;
    try { rec.start(); }
    catch (e) { running = false; setUi(); noSpeech('音声認識を開始できませんでした。' + UNSUPPORTED); }
  };
  $('dir').onchange = () => {
    try { localStorage.setItem('dir', $('dir').value); } catch (e) {}
    if (running) { running = false; rec.stop(); setUi(); }
    syncDir();
  };
})();
</script>
</body></html>
