name: Instagram リール自動投稿

on:
  schedule:
    - cron: "0 3 * * *"    # 毎日12:00（日本時間）
    - cron: "0 10 * * *"   # 毎日19:00（日本時間）
  workflow_dispatch: {}    # 手動で1本投稿したいときに使う

permissions:
  contents: write

concurrency:
  group: instagram-reels
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reels-videos
      - name: 1本投稿する
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841445779613440"
        run: python3 post.py
      - name: 投稿記録を保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.txt
          git commit -m "投稿記録を更新" || exit 0
          git push origin reels-videos
