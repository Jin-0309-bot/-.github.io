name: Instagram リール自動投稿

on:
  # 本来の合図：外部サービス（cron-job.org）が毎日 12:00 と 19:00（日本時間）に workflow_dispatch を送る
  workflow_dispatch:
    inputs:
      force:
        description: "枠に関係なく、今すぐ1本投稿する（手動で追加投稿したいときだけ true）"
        type: boolean
        default: false
  # 予備：外部からの合図が来なかったとき用。GitHub の時刻指定は大きく遅れることがあるが、
  # post.py が「昼の枠（11〜19時）／夜の枠（19〜翌11時）に1本ずつ」で判断するので、遅れて来ても二重投稿しない
  schedule:
    - cron: "47 3 * * *"    # 12:47（日本時間）
    - cron: "47 10 * * *"   # 19:47（日本時間）

permissions:
  contents: write

concurrency:
  group: instagram-reels
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reels-videos
      - name: 1本投稿する
        env:
          FORCE: ${{ github.event.inputs.force == 'true' && 'true' || 'false' }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841445779613440"
        run: python3 post.py
      - name: 24時間たった回のインサイトを記録する
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841445779613440"
        run: python3 insights.py
      - name: 投稿記録を保存する
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.txt insights.md
          git commit -m "投稿記録を更新" || exit 0
          git push origin reels-videos
