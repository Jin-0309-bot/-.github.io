name: Instagram リール自動投稿

on:
  schedule:
    # 12時台：12:00 と予備の 12:20・12:40（日本時間）
    - cron: "0 3 * * *"
    - cron: "20 3 * * *"
    - cron: "40 3 * * *"
    # 19時台：19:00 と予備の 19:20・19:40（日本時間）
    - cron: "0 10 * * *"
    - cron: "20 10 * * *"
    - cron: "40 10 * * *"
    # 予備の実行は、その時間帯にもう投稿済みなら何もしない（post.py が直近3時間の投稿を見て判断）
  workflow_dispatch: {}    # 手動で1本投稿したいときに使う

permissions:
  contents: write

concurrency:
  group: instagram-reels
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reels-videos
      - name: 1本投稿する
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841445779613440"
        run: python3 post.py
      - name: 24時間たった回のインサイトを記録する
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841445779613440"
        run: python3 insights.py
      - name: 投稿記録を保存する
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.txt insights.md
          git commit -m "投稿記録を更新" || exit 0
          git push origin reels-videos
