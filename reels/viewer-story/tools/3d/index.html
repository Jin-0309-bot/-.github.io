<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#f6f6f4;font-family:"Noto Sans CJK JP",sans-serif}
canvas{position:absolute;left:0;top:0}
#top{position:absolute;top:110px;width:100%;text-align:center;color:#8c8c92;font-size:30px}
#title{position:absolute;top:160px;width:100%;text-align:center;color:#1e1e22;font-size:36px;font-weight:700}
#sub{position:absolute;left:60px;right:60px;top:1430px;padding:28px 30px;border-radius:30px;background:rgba(255,255,255,.88);border:4px solid #1e1e22;
 color:#1e1e22;font-size:56px;font-weight:700;text-align:center;line-height:1.45;opacity:0;box-shadow:0 10px 40px rgba(0,0,0,.12);text-wrap:balance}
#cr{position:absolute;bottom:90px;width:100%;text-align:center;color:#96969c;font-size:28px}
</style></head><body>
<div id="top">※この物語はフィクションです</div><div id="title">キミが書く物語　第0話</div>
<div id="sub"></div><div id="cr">VOICEVOX:冥鳴ひまり</div>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const TL = await (await fetch('timeline.json')).json();
const W=1080,H=1920;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H); r.setPixelRatio(1); r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
r.toneMapping=THREE.ACESFilmicToneMapping; r.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(r.domElement);
const sc=new THREE.Scene(); const BG=new THREE.Color(0xf4f4f2); sc.background=BG; sc.fog=new THREE.Fog(0xf4f4f2,6,22);
const cam=new THREE.PerspectiveCamera(38,W/H,0.1,100);
sc.add(new THREE.HemisphereLight(0xffffff,0xdedede,1.6));
const sun=new THREE.DirectionalLight(0xffffff,1.5); sun.position.set(3,8,4); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.radius=8; Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4}); sc.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0xf6f6f4,roughness:1}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; sc.add(floor);
// 人影：足元を軸に起き上がる
const mat=new THREE.MeshStandardMaterial({color:0x44444e,roughness:0.45,metalness:0.0});
const pivot=new THREE.Group(); sc.add(pivot);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.34,0.75,12,32),mat); body.position.y=0.72; body.castShadow=true; pivot.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.27,48,32),mat); head.position.y=1.6; head.castShadow=true; pivot.add(head);
for(const s of [-1,1]){const a=new THREE.Mesh(new THREE.CapsuleGeometry(0.09,0.6,8,16),mat); a.position.set(s*0.45,0.85,0); a.rotation.z=s*0.12; a.castShadow=true; pivot.add(a);}
// 光の粒
function dot(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
const N=260, pos=new Float32Array(N*3), seed=[];
for(let i=0;i<N;i++){const x=(Math.random()-.5)*14,y=Math.random()*5,z=(Math.random()-.5)*14;pos.set([x,y,z],i*3);seed.push([x,y,z,0.05+Math.random()*0.15]);}
const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x8a8a96,size:0.05,transparent:true,opacity:0.55,map:dot(),alphaTest:0.01,depthWrite:false})); sc.add(pts);
const ease=x=>{x=Math.min(1,Math.max(0,x));return 1-Math.pow(1-x,3)};
const lerp=(a,b,k)=>a+(b-a)*k;
const sub=document.getElementById('sub');
window.renderAt=(t)=>{
  // 起き上がり（0.4〜3.2秒）
  const k=ease((t-0.4)/2.8);
  pivot.rotation.x=lerp(-Math.PI/2,0,k)+Math.sin(t*1.5)*0.015*k;
  pivot.position.z=lerp(0.0,0,k);
  head.rotation.y=Math.sin(t*0.7)*0.25*k; // 見回す
  // カメラ：真上から遠くの小さな人影 → 降りながら回り込む → 正面の全身 → ゆっくり寄る
  const c=ease(t/6.0);
  const ang=lerp(-2.2,0.15,c);
  const rad=lerp(3.0,7.2,c)-Math.max(0,t-6)*0.35;
  const hy=lerp(11.0,1.7,c);
  cam.position.set(Math.sin(ang)*rad,hy,Math.cos(ang)*rad);
  cam.lookAt(0,lerp(0.2,1.25,c),lerp(-0.8,0,ease((t-0.4)/2.8)));
  for(let i=0;i<N;i++){const s=seed[i];pos[i*3+1]=(s[1]+t*s[3])%5;pos[i*3]=s[0]+Math.sin(t*0.5+i)*0.1;}
  pg.attributes.position.needsUpdate=true;
  r.render(sc,cam);
  // 字幕
  let cur=null; for(const l of TL.lines) if(t>=l.start) cur=l;
  if(cur){sub.innerHTML=(cur.say.match(/[^、。？！]*[、。？！]?/g)||[]).filter(x=>x).map(x=>'<span style="display:inline-block">'+x+'</span>').join(''); sub.style.opacity=Math.min(1,(t-cur.start)/0.25);} else sub.style.opacity=0;
  document.body.style.opacity=Math.min(1,t/0.6,(TL.T-t)/0.6);
};
window.READY=true;
</script></body></html>
