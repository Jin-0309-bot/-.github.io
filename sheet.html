    </div><div class="glabel">種類</div></div>
  </div>
  <button class="rscroll r" id="rsR" aria-label="リボンを右へスクロール" hidden>›</button>
</div>

<div id="fbarRow">
  <div class="namewrap"><input id="nameBox" aria-label="名前ボックス" spellcheck="false" autocomplete="off"></div>
  <div class="fbtns">
    <button id="fCancel" title="キャンセル" disabled><span data-icon="close"></span></button>
    <button id="fEnter" title="入力" disabled><span data-icon="check"></span></button>
    <button id="fFx" title="関数の挿入" style="font:italic 700 14px Georgia,serif;color:#444">fx</button>
  </div>
  <textarea id="fbar" rows="1" aria-label="数式バー" spellcheck="false" autocomplete="off"></textarea>
  <button id="fbarExpand" title="数式バーを展開"><span data-icon="expand"></span></button>
</div>

<div id="gridArea">
  <div id="wrap">
    <table id="grid"></table>
    <div id="objs"></div>
    <textarea id="editor" spellcheck="false" autocomplete="off" aria-label="セル入力" rows="1"></textarea>
  </div>
</div>

<div id="sheetbar">
  <div class="snav">
    <button data-cmd="prevSheet" title="前のシート"><span data-icon="chevL"></span></button>
    <button data-cmd="nextSheet" title="次のシート"><span data-icon="chevR"></span></button>
  </div>
  <div id="tabs"></div>
  <button id="addSheet" data-cmd="addSheet" title="新しいシート (Shift+F11)"><span data-icon="plusCircle"></span></button>
  <div class="hscrollspace"></div>
</div>
<div id="statusbar">
  <span id="mode">準備完了</span>
  <span id="stat"></span>
  <div class="zoomctl">
    <button data-cmd="zoomOut" title="縮小">−</button>
    <input type="range" id="zoomRange" min="10" max="400" step="5" value="100" aria-label="ズーム">
    <button data-cmd="zoomIn" title="拡大">＋</button>
    <span id="zoomPct" title="ズーム">100%</span>
  </div>
</div>

<div id="printArea"></div>
<div id="toast"></div>
<input type="file" id="fileCsv" accept=".csv,.tsv,.txt,text/csv" hidden>
<input type="file" id="fileXlsx" accept=".xlsx,.xlsm,.xls,.ods" hidden>
<noscript><p style="padding:20px">この表計算はスクリプトを使います。JavaScript を有効にしてください。</p></noscript>

<script src="sheet/engine.js"></script>
<script src="sheet/icons.js"></script>
<script src="sheet/core.js"></script>
<script src="sheet/chart.js"></script>
<script src="sheet/ui.js"></script>
</body></html>
